name: Keep Streamlit App Awake

# Streamlit Community Cloud sleeps apps that get no visitors, which shows
# visitors a "get this app back up" screen instead of the app.
# scripts/keep_awake.py visits the app in a real headless browser (a plain
# curl does not count as a visit) and presses the wake button if needed.
on:
  schedule:
    # Every 2 hours: the app has been seen asleep ~4 hours after a good visit,
    # well inside Cloud's nominal 12-hour window. Public repo, so minutes are free.
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
      - name: Upload what Streamlit showed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: keep-awake-diagnostics
          path: |
            keep_awake.png
            keep_awake.txt
          if-no-files-found: ignore
          retention-days: 7
